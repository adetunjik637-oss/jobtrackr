# Render Blueprint — provisions the web service AND a Postgres database together.
# In the Render dashboard: New → Blueprint, connect this repo, and Render reads
# this file. It creates everything below; you only add the secret keys afterward.
databases:
  - name: jobtrackr-db
    plan: free            # check current free-tier terms in your Render dashboard
    databaseName: jobtrackr
    user: jobtrackr

services:
  - type: web
    name: jobtrackr
    runtime: python
    plan: free            # check current free-tier terms in your Render dashboard
    buildCommand: "bash ./build.sh"
    startCommand: "gunicorn jobtrackr.wsgi"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jobtrackr-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true        # Render generates a strong random value
      - key: DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: "4"
      - key: PYTHON_VERSION
        value: "3.12.4"
      # --- You fill these in the dashboard after the first deploy ---
      - key: OPENAI_API_KEY
        sync: false                # set in dashboard (keeps it out of the repo)
      - key: OPENAI_MODEL
        value: "gpt-4o-mini"
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_PLAN_CODE_NGN
        sync: false
      - key: PAYSTACK_PLAN_CODE_USD
        sync: false
      - key: PRICE_NGN
        value: "1500"
      - key: PRICE_USD
        value: "5"
      - key: FREE_MONTHLY_LETTERS
        value: "3"
