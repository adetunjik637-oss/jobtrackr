{% extends "base.html" %}
{% block title %}Sign up — JobTrackr{% endblock %}
{% block content %}
<div class="page-head"><h1>Create your account</h1></div>
<div class="card" style="max-width:480px;">
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-block" type="submit">Sign up free</button>
  </form>
  <p class="muted small" style="margin-top:16px;">
    Already have an account? <a class="plain" href="{% url 'login' %}">Log in</a>.
  </p>
</div>
{% endblock %}
